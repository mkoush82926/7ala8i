name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Required: migrations, lint, types, unit tests, production build.
  # ───────────────────────────────────────────────────────────────────────
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Supabase CLI uses the prefix before the first "_" as the
      # migration version (primary key of schema_migrations). Duplicates
      # break `supabase db push` / `db reset`, so fail early.
      - name: Check migration versions are unique
        run: |
          dupes="$(ls supabase/migrations | cut -d_ -f1 | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration versions in supabase/migrations: $dupes"
            exit 1
          fi

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      # Placeholder public values so src/lib/env.ts validation passes; no
      # real secrets are needed to compile. Mock mode stays off (it is
      # refused in production builds anyway).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

  # ───────────────────────────────────────────────────────────────────────
  # Optional: Playwright end-to-end tests against a local Supabase stack
  # (migrations + supabase/seed.sql, then e2e/global-setup.ts seeds the
  # e2e users). Reported on every run but does not block merging.
  # ───────────────────────────────────────────────────────────────────────
  e2e:
    name: End-to-end (Playwright + local Supabase)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `supabase` is a devDependency, so the CLI comes from node_modules.
      # `start` applies supabase/migrations and supabase/seed.sql.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Export Supabase credentials
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE_ROLE_KEY"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app (next build && next
      # start) and global-setup seeds the e2e users.
      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
